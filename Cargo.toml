[package]
name = "tailpipe"
description = "An SSH server that plays asciinema recordings to clients"
version = "0.5.1"
edition = "2024"
license = "GPL-3.0"
homepage = "https://clee.github.io/tailpipe/"

[dependencies]
russh = { version = "0.57", default-features = false, features = ["ring", "rsa"] }
rsa = "=0.10.0-rc.12"
pkcs8 = "=0.11.0-rc.11"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
ratatui = "0.30"

[dev-dependencies]
tempfile = "3"
